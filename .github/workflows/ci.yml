name: Offline plugin checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / part ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    # Observed Windows checks exceeded 30 minutes on a shared runner; keep a
    # finite allowance for the full suite and wheel build on both interpreters.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
        shard: [1, 2]
        exclude:
          - os: ubuntu-latest
            shard: 2
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      ALP_DISABLED: '1'
      CI_SHARD: ${{ matrix.shard }}
      CI_SHARD_COUNT: ${{ matrix.os == 'windows-latest' && '2' || '1' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prepare isolated data and configuration
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          temporary = Path(os.environ['RUNNER_TEMP'])
          isolated = {
              'ALP_HOME': str(temporary / 'agent-learning-state'),
              'ALP_CONFIG': str(temporary / 'agent-learning-config.json'),
              'ALP_RUNTIME_STORE': str(temporary / 'agent-learning-runtime-releases'),
              'CODEX_HOME': str(temporary / 'agent-learning-codex-home'),
          }
          os.environ.update(isolated)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment_file:
              for name, value in isolated.items():
                  environment_file.write(f'{name}={value}\n')
          for name in ('ALP_HOME', 'ALP_RUNTIME_STORE', 'CODEX_HOME'):
              Path(os.environ[name]).mkdir(parents=True, exist_ok=True)
          config = json.loads(Path('config.example.json').read_text(encoding='utf-8'))
          assert config['admin']['enabled'] is False
          assert config['admin']['auto_publish'] is False
          assert config['scheduler']['enabled'] is False
          assert config['scheduler']['auto_release'] is False
          assert config['scheduler']['sync_enabled'] is False
          assert config['hindsight']['enabled'] is False
          assert config['retrieval']['semantic']['enabled'] is False
          assert config['software_updates']['enabled'] is False
          configuration = json.dumps(config)
          Path(os.environ['ALP_CONFIG']).write_text(configuration, encoding='utf-8')
          (Path(os.environ['ALP_HOME']) / 'config.json').write_text(configuration, encoding='utf-8')

      # Dependency bootstrap uses the network; the checks and build below use local tools.
      - name: Install build tools
        run: python -B -m pip install --upgrade pip setuptools wheel

      # Reviewers and Hindsight are fakes. Hook entry tests use isolated subprocesses,
      # without enabling a real host. Native Codex checks skip when its CLI is absent.
      - name: Run offline regression suite
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          environment = dict(os.environ)
          # Fixtures select their own temporary home/config.json and exercise Hook
          # entry behavior. Do not mask them with the job's fallback switches.
          for name in ('ALP_CONFIG', 'ALP_DISABLED', 'ALP_HOOK_MODE', 'ALP_CONTEXT_HANDLE'):
              environment.pop(name, None)
          shard = int(os.environ['CI_SHARD'])
          shards = int(os.environ['CI_SHARD_COUNT'])
          modules = sorted(path.stem for path in Path('tests').glob('test_*.py'))
          selected = modules[shard - 1::shards]
          assert 1 <= shard <= shards and selected
          print(f'Offline part {shard}/{shards}: {len(selected)}/{len(modules)} test modules', flush=True)
          arguments = (['discover', '-s', 'tests', '-v'] if shards == 1 else
                       ['-v', *['tests.' + name for name in selected]])
          subprocess.run(
              [sys.executable, '-B', '-m', 'unittest', *arguments],
              env=environment,
              check=True,
          )

      - name: Build wheel without resolving dependencies
        run: python -B -m pip wheel --no-deps --no-build-isolation --no-index --wheel-dir dist .
