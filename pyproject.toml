[project]
name = "agent-learning-plugin"
dynamic = ["version"]
description = "Local-first governed memory for coding agents"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-learning = "agent_learning.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_learning*"]

[tool.setuptools.dynamic]
version = {attr = "agent_learning.__version__"}

[tool.setuptools.cmdclass]
build_py = "build_support.PluginBuildPy"
