<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Learning</title>
  <script src="/preload.js"></script>
  <style>

    main{padding:20px;max-width:700px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{font-size:20px;margin:0}h2{font-size:16px;margin:22px 0 10px}.muted,small{opacity:.75;line-height:1.5}
    #notice{margin:18px 0;line-height:1.5}#panel[hidden]{display:none}.path{overflow-wrap:anywhere}

  </style>
</head>
<body>
<main>
  <header><h1>Agent Learning</h1><select id="language" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option></select></header>
  <p id="notice" role="status" aria-live="polite"></p>
  <button id="reconnect" type="button" hidden></button>
  <section id="panel" hidden>
    <h2 id="project"></h2><div id="workspace" class="path muted"></div>
    <div class="stats" id="stats"></div>
    <div class="detail" id="admin"></div>
    <div class="row"><button id="refresh"></button><button id="debug"></button><button id="browser"></button><button id="review"></button></div>

    <h2 id="frequencyTitle"></h2>
    <p class="muted" id="shared"></p>
    <div class="row" id="presets"></div>
    <div class="warning" id="quota"></div>
    <h2 id="historyTitle"></h2><p class="muted" id="historyNote"></p><button id="history"></button>
    <p id="result" role="status" aria-live="polite"></p>
  </section>
</main>

    $("reconnect").hidden = disposed || !recoveryAvailable;
    $("reconnect").disabled = reconnectTurn !== null || bindTurn !== null;
    for (const [id, key] of [["refresh","refresh"],["debug","debug"],["debugTitle","debugTitle"],["browser","browser"],["review","review"],["frequencyTitle","frequency"],["shared","shared"],["quota","quota"],["historyTitle","historyTitle"],["historyNote","historyNote"],["history","history"]]) $(id).textContent = t(key);
    if (!summary || !capability) { $("notice").textContent = t(noticeKey); return; }
    $("project").textContent = summary.project_name || "Agent Learning";
    $("workspace").textContent = summary.workspace || "";
    $("stats").replaceChildren();
    for (const [key,label] of [["active","active"],["work_memory","work"],["pending_review_cases","pending"],["candidates","candidates"]]) {
      const box = document.createElement("div"); box.className = "stat";
      const number = document.createElement("b"); number.textContent = count(summary.counts?.[key]);
      const description = document.createElement("span"); description.textContent = t(label);
      box.append(number, description); $("stats").append(box);
    }
    const p = summary.project_usage?.scope === "project" && summary.project_usage.project_id === summary.project_id ? summary.project_usage : null;
    const g = summary.global_usage || {};
    const lines = [`${t(summary.admin_admission_enabled ? "enabled" : "disabled")} · ${t("model")}: ${summary.model || t("waitingModel")}`];
    const readiness = summary.administrator_readiness;
    if (readiness?.provider === "antigravity" && readiness.launcher_available === false) lines.push(t("cliMissing"));
    else if (readiness?.provider === "antigravity" && readiness.launcher_available === true) lines.push(t(readiness.capability_checked === true ? readiness.capability_ready === true ? "cliProtocol" : "cliUnsupported" : "cliFound"));
    const capture = summary.host_capture;
    if (capture?.version === 1 && capture.host_scope === summary.host_scope && capture.scope === "project_recent_capture") {
      const key = capture.scan_limited === true ? "captureWindowLimited" : capture.state === "unavailable" ? "captureUnavailable" : capture.state !== "observed" ? "captureUnknown" : capture.public_delivery === "complete" ? "captureComplete" : ({available:"captureResponse",partial:"captureResponsePartial"})[capture.public_response] || ({partial:"capturePartial",unavailable:"captureMissing"})[capture.public_delivery] || "captureUnknown";
      lines.push(`${t("captureTitle")}: ${t(key)}`);
      const recovery=captureRecoveryText(capture,summary.host_scope);
      if(recovery)lines.push(`${t("captureRecovery")}: ${recovery}`);
      const input = capture.input_window;
      if (input && typeof input === "object") {
        const inputKey = input.state === "observed" ? ({available:"inputAvailable",partial:"inputPartial",unavailable:"inputMissing"})[input.public_input] || "inputUnknown" : "inputUnknown";
        const windowKey = input.state === "observed" && input.available === true && input.reason === "bound" ? "inputWindowBound" : "inputWindowUnknown";
        lines.push(`${t("inputTitle")}: ${t(inputKey)} ${t(windowKey)}`);
      }
    }
    const staged = stageReview(summary), tokenMode = !!staged || p?.budget_mode === "tokens";
    if (p) {
      lines.push(`${t("attempts")}: ${count(p.counted_attempts)} · ${t("completed")}: ${count(p.completed_reviews)} · ${t("failedCalls")}: ${count(p.failed_attempts)}`);
      if (tokenMode) lines.push(`${t("reportedTokens")}: ${count(p.reported_tokens)}`, `${t("reservedTokens")}: ${count(p.token_reservations)}`, `${t("remainingTokens")}: ${count(p.remaining_reported_tokens)} / ${count(p.max_reported_tokens_per_day)}`);
      else lines.push(`${t("remaining")}: ${count(p.remaining_calls)} / ${count(p.max_calls_per_day)}`);
    }
    else lines.push(t("usageUnavailable"));
    lines.push(`${t("globalCalls")}: ${count(g.counted_attempts ?? g.used_calls)} · ${t("globalLeft")}: ${count(g.remaining_calls)}`);
    if (p?.next_reset_at) lines.push(`${t("reset")}: ${new Date(p.next_reset_at * 1000).toLocaleString(language)}`);
    if (summary.admission?.blocking_scope) lines.push(`${t("blocking")}: ${summary.admission.blocking_scope}`);
    if (summary.reason) lines.push(`${t("reason")}: ${reasonText(summary.reason)}`);
    if (summary.admin_phase) lines.push(`${t("phase")}: ${summary.admin_phase}`);
    if (staged) {
      const phases = staged.phases || {}, latest = staged.recent_batches?.[0];
      lines.push(t("stageFrequency").replace("{n}", staged.policy.every_phases), `${t("stageQueue")}: ${["awaiting_stop","sealed","queued","partial","completed"].map(key => phases[key] || 0).join(" / ")}`);
      const deferred = staged.locally_deferred_phase_count ?? phases.routine_deferred ?? 0;
      if (deferred) lines.push(t("stageLocallyDeferred").replace("{n}", deferred));
      lines.push(...phaseHealthLines(staged));
      if (latest) lines.push(`${t("stageCoverage")}: ${t(latest.coverage_complete === true ? "coverageFull" : latest.coverage_complete === false ? "coveragePartial" : "unknown")}`);
    }
    if (tokenMode) { lines.push(t("tokenEstimate")); $("quota").textContent = t("tokenEstimate"); }
    $("admin").textContent = lines.join("\n");
    $("presets").replaceChildren();
    for (const preset of staged ? ["off"] : ["off","minimal","light","balanced","active"]) {
      const button = document.createElement("button"); button.textContent = t(preset === "active" ? "activePreset" : preset);
      button.addEventListener("click", () => changePreset(preset)); button.dataset.projectSetting = "true"; $("presets").append(button);
    }
    for (const button of document.querySelectorAll("#panel button")) button.disabled = busy || (button.dataset?.projectSetting === "true" && (!p || !Number.isInteger(summary.expected?.expected_project_budget_version)));
    renderDebug();
    $("panel").hidden = false; $("notice").textContent = t("ready");
  }

  function backupPreviewLines(b) {
    if (!b || typeof b !== "object") return [];
    if (b.status === "unavailable") return [[t("backupPreview"),t("unknown")]];
    const entries = Array.isArray(b.entries) ? b.entries.slice(0,20) : [];
    const n = value => Number.isInteger(value) && value >= 0 ? String(value) : t("unknown");
    const lines = [[t("backupPreview"),t("backupReadOnly")], [t("backupCount"),n(entries.length)],
      [t("backupLegacy"),n(b.legacy_count)], [t("backupRoot"),typeof b.backup_root === "string" ? b.backup_root : t("unknown")]];
    if (b.verified !== true) lines.push([t("backupValidation"),t("backupUnverified")]);
    for (const entry of entries) {
      if (!entry || typeof entry.name !== "string") continue;
      const state = entry.needs_review || b.verified !== true ? "backupUnverified" : entry.migration_allowed ? "backupMigration" : entry.retained ? "backupRetained" : "backupAvailable";
      lines.push([entry.name,[entry.version || t("unknown"),t(entry.location === "legacy" ? "backupLegacyLocation" : "backupExternalLocation"),t(state)].join(" · ")]);
    }
    if (b.truncated || b.scan_limited || b.entries?.length > 20) lines.push([t("backupPreview"),t("backupMore")]);
    return lines;
  }

  function renderDebug() {
    const d = diagnostics;
    if (!d || d.version !== 1 || d.project?.id !== summary?.project_id) { $("debugPanel").hidden = true; return; }
    const c = d.connection || {}, i = d.installation || {}, p = d.project || {}, a = d.administrator || {};
    const val = value => String(value ?? t("unknown"));
    const connection = value => ["responding","verified"].includes(value) ? t(value) : t("unknown");
    const lines = [[t("uiBridge"),connection(c.ui_bridge)], [t("mcp"),connection(c.mcp)], [t("hook"),connection(c.hook)],
      [t("install"),connection(i.state)], [t("host"),p.host_scope], [t("home"),p.home], [t("version"),val(i.running_version)+" / "+val(i.running_protocol)],
      [t("installedVersion"),val(i.version)+" / "+val(i.protocol)],
      [t("runtimeMatch"),typeof i.running_runtime_matches_installation === "boolean" ? t(i.running_runtime_matches_installation ? "matches" : "mismatch") : t("unknown")],
      [t("schema"),val(p.storage_schema)+" / "+val(p.index_version)],
      [t("phase"),a.phase], [t("reason"),reasonText(a.reason)]];
    if (a.next_due) lines.push([t("nextDue"),new Date(a.next_due * 1000).toLocaleString(language)]);
    if (a.last_provider_failure) {
      const f = a.last_provider_failure;
      lines.push([t("failure"),[f.reason_code,f.http_status,f.parameter_code].filter(v => v !== null && v !== undefined).join(" · ")]);
    }
    const recovery=captureRecoveryText(d.capture,p.host_scope);
    if(recovery)lines.push([t("captureRecovery"),recovery]);
    lines.push(...backupPreviewLines(d.backups));
    $("debugOutput").textContent = lines.map(([key,value]) => key+": "+val(value)).join("\n")+"\n"+t("latestUnchecked");
    $("debugPanel").hidden = false;
  }

  function monotonicNow() {
    const value = typeof performance !== "undefined" && typeof performance.now === "function" ? performance.now() : null;
    return Number.isFinite(value) && value >= 0 ? value : null;
  }

  async function readDeadline(promise) {
    let timer;
    try {
      return await Promise.race([promise, new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error("local_read_timeout")), 15000);
      })]);
    } finally { clearTimeout(timer); }
  }

  async function post(method, data) {
    const response = (async () => {
      const result = await window.sidecar.fetch("/api/" + method, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
      if (!result.ok) throw new Error("unavailable");
      return result.json();
    })();
    return method === "bootstrap" || method === "action" && ["status","debug"].includes(data.action)
      ? readDeadline(response) : response;
  }

  function readIdentity(value) {
    if (![value?.project_id,value?.workspace,value?.host_scope].every(key => typeof key === "string" && key.trim())
        || ![value.expected?.expected_session_epoch,value.expected?.expected_governance_epoch]
          .every(key => Number.isSafeInteger(key) && key >= 0)) return null;
    return JSON.stringify([value.project_id,value.workspace,value.host_scope,
      value.expected.expected_session_epoch,value.expected.expected_governance_epoch]);
  }

  const validFingerprint = value => typeof value === "string" && /^[0-9a-f]{64}$/.test(value);

  async function renewReadLease(turn) {
    const now = monotonicNow(), identity = readIdentity(summary);
    // Server leases last 300 seconds. Start at request dispatch, with a margin;
    // renew only when a person asks for a read, never on a periodic timer.
    if (leaseStartedAt === null || now === null || now < leaseStartedAt || now - leaseStartedAt < 240000) return true;
    if (!identity || !validFingerprint(installationFingerprint)) { hide("connectionLost", true); return false; }
    const boundContext = context, oldCapability = capability, fingerprint = installationFingerprint;
    const current = () => !disposed && turn === generation && context === boundContext && capability === oldCapability
      && installationFingerprint === fingerprint && window.sidecar?.conversationId === boundContext.conversation_id;
    const abandon = () => { if (!disposed && turn === generation) { ++generation; hide(); } return false; };
    $("notice").textContent = t("renewingRead");
    const uris = await readDeadline(window.sidecar.getWorkspaceUris());
    if (!current()) return abandon();
    if (!Array.isArray(uris) || uris.length !== 1 || uris[0] !== boundContext.workspace_uris[0]) return abandon();
    const started = monotonicNow();
    if (started === null || started < now) return abandon();
    const result = await post("bootstrap", {...boundContext,workspace_uris:uris.slice()});
    if (!current()) return abandon();
    if (result.visible !== true || typeof result.capability !== "string" || !result.capability
        || !validFingerprint(result.installation_fingerprint) || result.installation_fingerprint !== fingerprint
        || readIdentity(result.summary) !== identity) return abandon();
    context = {...boundContext,workspace_uris:uris.slice()};
    capability = result.capability; leaseStartedAt = started; summary = result.summary; diagnostics = null;
    return true;
  }

  async function bind(uris, recoverable = false) {
    if (disposed) return;
    const turn = ++generation;
    reconnectTurn = null;
    hide("connecting");
    recoveryIntent = recoverable;
    bindTurn = turn;
    const conversation = window.sidecar?.conversationId;
    if (!Array.isArray(uris) || uris.length !== 1 || typeof conversation !== "string" || !conversation) { bindTurn = null; hide(); return; }
    const next = {workspace_uris:uris.slice(),conversation_id:conversation};
    const started = monotonicNow();
    try {
      const result = await post("bootstrap", next);
      if (disposed || turn !== generation) return;
      if (window.sidecar?.conversationId !== conversation) { hide(); return; }
      if (!result.visible || typeof result.capability !== "string" || !result.summary) {
        const retryable = recoverable && ["connection_unavailable", "panel_refresh_required"].includes(result.reason);
        hide(retryable ? "connectionLost" : "unavailable", retryable); return;
      }
      recoveryIntent = false;
      context = next; capability = result.capability; leaseStartedAt = started;
      installationFingerprint = validFingerprint(result.installation_fingerprint) ? result.installation_fingerprint : null;
      summary = result.summary; render();
    } catch { if (!disposed && turn === generation) hide("connectionLost", recoverable); }
    finally { if (bindTurn === turn) { bindTurn = null; render(); } }
  }

  async function reconnect(recoverable = recoveryAvailable || !!context) {
    if (disposed || busy || reconnectTurn !== null || bindTurn !== null) return;
    const turn = ++generation, conversation = window.sidecar?.conversationId;
    hide("connecting"); recoveryIntent = recoverable; reconnectTurn = turn; render();
    let timer;
    try {
      const uris = await Promise.race([window.sidecar.getWorkspaceUris(), new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error("workspace_context_timeout")), 15000);
      })]);
      clearTimeout(timer);
      if (disposed || turn !== generation) return;
      if (window.sidecar?.conversationId !== conversation) { hide(); return; }
      await bind(uris, recoverable);
    } catch {
      if (!disposed && turn === generation) hide("connectionLost", recoverable);
    } finally {
      clearTimeout(timer);
      if (reconnectTurn === turn) { reconnectTurn = null; render(); }
    }
  }

  async function action(name, extra = {}) {
    if (disposed || !context || !capability || busy) return;
    if (window.sidecar?.conversationId !== context.conversation_id) { ++generation; hide(); return; }
    const turn = generation;
    busy = true; render(); $("result").textContent = "";
    try {
      if (["status","debug"].includes(name) && !await renewReadLease(turn)) return;
      if (disposed || turn !== generation || !context || !capability) return;
      if (window.sidecar?.conversationId !== context?.conversation_id) { ++generation; hide(); return; }
      const request = {...context,capability,action:name,...(["status","debug"].includes(name) ? {} : {request_id:crypto.randomUUID()}),...extra};
      const result = await post("action", request);
      if (disposed || turn !== generation) return;
      if (window.sidecar?.conversationId !== context?.conversation_id) { ++generation; hide(); return; }
      if (!result.visible || !result.summary) { hide(["status","debug"].includes(name) ? "connectionLost" : "actionUncertain", true); return; }
      summary = result.summary; diagnostics = result.diagnostics || null;
      $("result").textContent = result.opened ? t("opened") : name === "set_admin_preset" ? t("saved") : result.history ? `${["continue_existing","no_changes"].includes(result.history.preparation?.action) ? (language === "zh-CN" ? "已复用历史批次，请进入审批查看进度；未调用模型。" : "Existing history batch reused; open review for progress. No model call.") : t(result.history.state === "materialized" ? "archived" : "archivedPartial")} ${count(result.history.archived_cases)} (${result.history.state || "unknown"})` : "";
    } catch {
      if (!disposed && turn === generation) hide(["status","debug"].includes(name) ? "connectionLost" : "actionUncertain", true);
    } finally { if (!disposed && turn === generation) { busy = false; render(); } }
  }

  function changePreset(preset) {
    if (stageReview(summary) && preset !== "off") return;
    if (!summary || busy || !window.confirm(t(preset === "off" ? "confirmOff" : "confirmPreset"))) return;
    action("set_admin_preset", {preset,confirm:true,expected:{...summary.expected},request_id:crypto.randomUUID()});
  }
  $("refresh").addEventListener("click", () => reconnect());
  $("reconnect").addEventListener("click", () => reconnect());
  $("debug").addEventListener("click", () => action("debug"));
  $("browser").addEventListener("click", () => action("open_browser"));
  $("review").addEventListener("click", () => action("open_review"));
  $("history").addEventListener("click", () => { if (!busy && window.confirm(t("archiveConfirm"))) action("archive_history", {confirm:true,request_id:crypto.randomUUID()}); });
  $("language").addEventListener("change", () => { language = $("language").value; render(); });
  window.addEventListener("pagehide", () => {
    resumeRecovery = !!context || recoveryAvailable || recoveryIntent;
    disposed = true; ++generation; reconnectTurn = null; bindTurn = null; hide("waiting");
  });
  window.addEventListener("pageshow", () => {
    if (!disposed) return;
    disposed = false; reconnect(resumeRecovery);
  });
  render(); hide("waiting");
  if (window.parent === window || !window.sidecar || typeof window.sidecar.getWorkspaceUris !== "function"
      || typeof window.sidecar.onWorkspaceChange !== "function") { hide(); return; }
  // Subscribe before awaiting the host's initial push. A switch invalidates old
  // controls immediately, even when an earlier bootstrap/action is still pending.
  window.sidecar.onWorkspaceChange((uris) => { if (!disposed) bind(uris); });
  window.sidecar.getWorkspaceUris().then((uris) => { if (generation === 0 && !disposed) bind(uris); }).catch(() => { if (generation === 0 && !disposed) hide(); });
})();
</script>
</body>
</html>
